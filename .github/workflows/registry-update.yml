name: Registry Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  build:
    name: Build registry packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore GroundKit.slnx

      - name: Build solution
        run: dotnet build GroundKit.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --solution GroundKit.slnx --no-build --configuration Release

      - name: Validate and build registry definitions
        run: |
          dotnet run --project src/GroundKit.Cli --no-build --configuration Release -- \
            registry validate --dir registry
          dotnet run --project src/GroundKit.Cli --no-build --configuration Release -- \
            registry build-all --dir registry --output ./dist-packages

      - name: Generate static registry catalog and Release assets
        env:
          REGISTRY_TAG: registry-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          dotnet run --project src/GroundKit.Cli --no-build --configuration Release -- \
            registry catalog-index --dir registry --output ./dist-packages \
            --destination ./dist-catalog \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$REGISTRY_TAG/"

      - name: Upload registry packages
        uses: actions/upload-artifact@v7
        with:
          name: groundkit-registry-${{ github.run_id }}
          path: ./dist-packages/*.db
          if-no-files-found: error
          retention-days: 14

      - name: Publish registry snapshot Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TAG: registry-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$REGISTRY_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --latest=false \
            --title "Registry snapshot $REGISTRY_TAG" \
            --notes "Documentation packages and catalog built from $GITHUB_SHA."
          gh release upload "$REGISTRY_TAG" --repo "$GITHUB_REPOSITORY" \
            ./dist-catalog/assets/*.db ./dist-catalog/index.json
          gh release edit "$REGISTRY_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
