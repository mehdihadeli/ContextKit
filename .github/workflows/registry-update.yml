name: Registry Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  build:
    name: Build registry packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore GroundKit.slnx

      - name: Build solution
        run: dotnet build GroundKit.slnx --no-restore --configuration Release

      - name: Run tests
        env:
          # Offline only. The live clone/publish checks get their own steps below, targeted with
          # --filter-class so the slow ones run once instead of everywhere.
          GROUNDKIT_NETWORK_TESTS: "0"
        run: dotnet test --solution GroundKit.slnx --no-build --configuration Release

      # The live registry checks run here rather than in build-and-publish so that a third party
      # being down cannot fail a pull request. ttl.sh needs no credentials, so nothing has to be
      # provisioned for these steps.
      - name: Verify OCI publishing against a live registry
        env:
          GROUNDKIT_NETWORK_TESTS: "1"
        run: |
          dotnet test --project tests/GroundKit.Registry.Tests --no-build --configuration Release \
            --filter-class "GroundKit.Registry.Tests.Integration.TtlShPublishIntegrationTests"

      - name: Verify add against live sites
        env:
          GROUNDKIT_NETWORK_TESTS: "1"
        run: |
          dotnet test --project tests/GroundKit.Cli.Tests --no-build --configuration Release \
            --filter-class "GroundKit.Tests.Integration.AddFromWebsiteIntegrationTests" \
            --filter-class "GroundKit.Tests.Integration.AddWithGitRepositoryIntegrationTests" \
            --filter-class "GroundKit.Tests.Integration.AddFromDirectoryIntegrationTests"

      - name: Validate and build registry definitions
        run: |
          dotnet run --project src/GroundKit.Cli --no-build --configuration Release -- \
            registry validate --dir registry
          dotnet run --project src/GroundKit.Cli --no-build --configuration Release -- \
            registry build-all --dir registry --output ./dist-packages --allow-failures \
            | tee registry-build.log
          failures="$(sed -n 's/^RegistryBuildFailures=\([0-9]\+\)$/\1/p' registry-build.log | tail -1)"
          if [ -n "$failures" ] && [ "$failures" -gt 0 ]; then
            echo "::warning::$failures registry definition(s) failed to build; the catalog will be incomplete."
          fi

      - name: Upload registry build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: groundkit-registry-build-log-${{ github.run_id }}
          path: registry-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to the GitHub Container Registry
        # Writes ~/.docker/config.json, which the CLI reads for its OCI credentials.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages to GitHub Container Registry
        run: |
          # GHCR rejects uppercase characters in the repository path.
          oci_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          dotnet run --project src/GroundKit.Cli --no-build --configuration Release -- \
            registry push-oci --dir registry --output ./dist-packages \
            --oci-repository "$oci_repository" \
            --oci-references ./oci-references.json
          echo "::notice::Packages published to $oci_repository"

      - name: Verify registry packages are anonymously pullable
        # GHCR creates packages private on first publish and installs are anonymous, so every package
        # must be public. GitHub exposes no way to change that programmatically: the Packages REST API
        # has only GET, DELETE and restore, so PATCH/PUT against `/user/packages/container/<name>`
        # returns 404 (verified against both the user and org namespaces). Visibility is a UI-only
        # action, and for a personal account it has to be repeated per package, so this step reports
        # instead of pretending to fix anything: it probes each package exactly the way a consumer
        # client does and names the ones that would fail to install.
        # Deliberately non-fatal - the anonymous install check below is the authoritative gate, and
        # failing here on visibility alone would hide a real pull regression.
        continue-on-error: true
        run: |
          # jq keys are case sensitive and both generated files use the C# record property names
          # verbatim, so the paths below are PascalCase. A wrong path makes jq iterate over null,
          # which under the default `bash -e` only fails the pipeline's last command and silently
          # turns this step into a no-op, so the package count is asserted first.
          total="$(jq -r '.Packages | length' ./oci-references.json)"
          if [ -z "$total" ] || [ "$total" -eq 0 ]; then
            echo "::error::oci-references.json lists no packages; nothing can be verified."
            exit 1
          fi

          verified=0
          not_public=0
          # Process substitution keeps the counters in this shell; a pipeline would run the loop in
          # a subshell and lose them. `tr -d '\r'` is a no-op on the Linux runners, but jq on Windows
          # writes CRLF, and a trailing carriage return on the digest makes curl reject the URL as
          # malformed - so strip it to keep the step runnable locally.
          while IFS='|' read -r repository digest; do
            # Repository is the fully qualified "<registry>/<path>" from oci-references.json.
            [[ "$repository" =~ ^([^/]+)/(.+)$ ]] || continue
            registry="${BASH_REMATCH[1]}"
            path="${BASH_REMATCH[2]}"

            # Fetching a pull token anonymously is the first thing a client does. GHCR answers 403
            # when the package is not anonymously readable, which is exactly the private case.
            if ! token="$(curl -fsS --max-time 30 \
              "https://$registry/token?service=$registry&scope=repository:$path:pull" \
              | jq -r '.token // empty')" || [ -z "$token" ]; then
              echo "::warning::$repository is not anonymously readable; set its visibility to Public (Package settings -> Danger Zone -> Change visibility)."
              not_public=$((not_public + 1))
              continue
            fi

            status="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://$registry/v2/$path/manifests/$digest")"
            if [ "$status" = "200" ]; then
              verified=$((verified + 1))
            else
              echo "::warning::$repository manifest probe returned $status for $digest."
              not_public=$((not_public + 1))
            fi
          done < <(jq -r '.Packages[] | "\(.Repository)|\(.Digest)"' ./oci-references.json | tr -d '\r' | sort -u)

          if [ "$not_public" -gt 0 ]; then
            echo "::warning::$not_public of $total package(s) are not publicly pullable. Anonymous installs fail until each is switched to Public in its Package settings; GitHub offers no API for this."
          fi
          echo "Anonymous pull probe: $verified of $total package(s) verified, $not_public not pullable."

      - name: Generate static registry catalog
        run: |
          dotnet run --project src/GroundKit.Cli --no-build --configuration Release -- \
            registry catalog-index --dir registry --output ./dist-packages \
            --destination ./dist-catalog \
            --oci-references ./oci-references.json

      - name: Verify published packages install like a consumer would
        # The catalog is the consumer contract, so the real CLI installs from a local copy of it.
        # This fails the run when a catalog points at an artifact a consumer cannot pull, which is
        # otherwise only discoverable once the catalog has already been deployed.
        # DOCKER_CONFIG points at an empty directory so the install runs anonymously, exactly like
        # an end user. Without this the client would reuse the credentials the login step wrote and
        # pass even when a package is still private in GHCR.
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker-config
        run: |
          # The catalog uses the C# record property names verbatim, so these jq paths are
          # PascalCase. A jq path that misses reports "Cannot iterate over null" and leaves the
          # variables empty, which would otherwise surface later as a confusing install error.
          if [ "$(jq -r '.Packages | length' ./dist-catalog/index.json)" -eq 0 ]; then
            echo "::error::The generated catalog lists no packages."
            exit 1
          fi

          python3 -m http.server 8123 --bind 127.0.0.1 --directory ./dist-catalog >/dev/null 2>&1 &
          server_pid=$!
          catalog_url="http://127.0.0.1:8123/index.json"
          ready=""
          for _ in $(seq 1 30); do
            if curl -fsS "$catalog_url" >/dev/null; then
              ready="yes"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::The local catalog server never became reachable at $catalog_url."
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi

          # The smallest package keeps the check fast while still exercising the full pull path.
          read -r reference version <<< "$(jq -r \
            '[.Packages[]] | sort_by(.Size) | .[0] | "\(.Registry)/\(.Name) \(.Version)"' \
            ./dist-catalog/index.json)"
          if [ -z "$reference" ] || [ -z "$version" ]; then
            echo "::error::Could not read a package reference from ./dist-catalog/index.json."
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
          echo "Installing $reference $version from $catalog_url"
          dotnet run --project src/GroundKit.Cli --no-build --configuration Release -- \
            install "$reference" "$version" --registry-url "$catalog_url"
          echo "::notice::Verified $reference $version installs from the published catalog"

      - name: Upload registry catalog
        uses: actions/upload-artifact@v7
        with:
          name: groundkit-registry-catalog
          path: ./dist-catalog/index.json
          if-no-files-found: error
          retention-days: 90
