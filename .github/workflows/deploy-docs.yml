name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Registry Update]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build VitePress site
        working-directory: docs
        run: npm run build

      - name: Include newest published registry catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp \
            | jq -r '[.[][] | select(.draft == false and (.tag_name | test("^registry-[0-9]+-[0-9]+$")))] | sort_by(.published_at) | last | .tag_name // empty')
          if [ -n "$tag" ]; then
            mkdir -p docs/.vitepress/dist/registry
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern index.json --dir docs/.vitepress/dist/registry --clobber
          else
            echo "No published registry snapshot yet; deploying documentation only."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report registry catalog URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Registry catalog (available after first snapshot): %s/registry/index.json\n' "${PAGE_URL%/}" >> "$GITHUB_STEP_SUMMARY"
