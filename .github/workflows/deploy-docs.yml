name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Registry Update]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build VitePress site
        working-directory: docs
        run: npm run build

      - name: Include newest registry catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The catalog ships as a workflow artifact; packages themselves live in GHCR.
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow registry-update.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            mkdir -p docs/.vitepress/dist/registry
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name groundkit-registry-catalog --dir docs/.vitepress/dist/registry
          else
            echo "No successful registry snapshot yet; deploying documentation only."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report registry catalog URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Registry catalog (available after first snapshot): %s/registry/index.json\n' "${PAGE_URL%/}" >> "$GITHUB_STEP_SUMMARY"
