name: angular
description: "Web application framework"
repository: https://github.com/angular/angular

# Angular tags releases without a "v" prefix, so every version pins its tag explicitly instead of
# relying on the default "v{version}" pattern. Versions are listed newest first: the first entry is
# what "registry build angular" selects when no version argument is given.
versions:
  - version: "21.0.3"
    tag: "21.0.3"
    source:
      type: git
      url: https://github.com/angular/angular
      docs_path: adev/src/content
  - version: "20.3.15"
    tag: "20.3.15"
    source:
      type: git
      url: https://github.com/angular/angular
      docs_path: adev/src/content
  - version: "19.2.17"
    tag: "19.2.17"
    source:
      type: git
      url: https://github.com/angular/angular
      docs_path: adev/src/content
